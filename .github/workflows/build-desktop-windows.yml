# build-desktop-windows.yml
#
# Builds the Wails desktop binary (alice-desktop.exe) + SHA-256 checksum for
# the Windows installer. The legacy electron-builder NSIS/MSI pipeline was
# deprecated (Wails self-update exists); this workflow is the only Windows
# desktop artifact builder.
#
# CI pinning policy (see AGENTS.md → Dependency Pinning Policy):
#   - GitHub Actions → commit SHA + comment with version
#   - pip → ==exact
#   - everything else → SHA-pinned via the lockfile

name: Build Windows Wails Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      arch:
        description: 'Architecture to build'
        required: false
        default: 'amd64'
        type: choice
        options:
          - amd64
      publish_tag:
        description: 'Release tag to upload the artifacts to (empty = build only, no upload)'
        required: false
        default: ''
        type: string

permissions:
  contents: write    # needed for release upload
  packages: read

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wails-build:
    name: Build Wails desktop binary
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Compute artifact suffix
        # github.ref_name contains "/" on branch dispatches, which is invalid in
        # an artifact name; publish_tag is slash-free.
        id: meta
        run: |
          $suffix = "${{ inputs.publish_tag }}"
          if (-not $suffix) { $suffix = "${{ github.ref_name }}" }
          $suffix = $suffix -replace '[^A-Za-z0-9._-]', '-'
          "suffix=$suffix" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        shell: pwsh

      - name: Install Node.js
        uses: actions/setup-node@v5  # v5.0.0
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5  # v5.3.0
        with:
          go-version: '1.25.x'
          cache-dependency-path: apps/desktop-wails/go.sum

      - name: Install uv (for embedded Python bundle)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: 'latest'

      - name: Install mingw-w64 GCC (Wails v2 links CGO on Windows)
        shell: pwsh
        # The third-party action shelled out to `choco install mingw` once; a
        # flaky community feed ("Unable to find package 'mingw'") failed the
        # whole release. Retry the install, and accept a copy already on the
        # image instead of assuming the action's install path.
        run: |
          $candidates = @(
            'C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin',
            'C:\ProgramData\mingw64\mingw64\bin',
            'C:\mingw64\bin'
          )

          function Find-Mingw {
            $candidates | Where-Object { Test-Path (Join-Path $_ 'gcc.exe') } | Select-Object -First 1
          }

          $bin = Find-Mingw
          for ($i = 1; -not $bin -and $i -le 3; $i++) {
            Write-Host "choco install mingw (attempt $i)"
            choco install mingw -y --no-progress
            Start-Sleep -Seconds 5
            $bin = Find-Mingw
          }

          if (-not $bin) { throw "MinGW gcc not found (package feed unavailable)" }
          Write-Host "mingw bin: $bin"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
        shell: pwsh

      - name: Install NSIS
        # wails build -nsis shells out to makensis; the stock image doesn't
        # ship it. Chocolatey's community feed is the fast path but it goes
        # down (observed: "Failed to fetch results from V2 feed" on every
        # retry), so fall back to the official portable zip from SourceForge.
        # GITHUB_PATH only affects LATER steps, so validate with the absolute
        # path here as well.
        run: |
          function Find-Nsis {
            $dirs = @("C:\Program Files (x86)\NSIS", "C:\Program Files\NSIS") + @(
              Get-ChildItem "C:\Program Files*\NSIS", "$env:RUNNER_TEMP\nsis-portable" -Recurse -Directory -ErrorAction SilentlyContinue |
                ForEach-Object { $_.FullName }
            )
            $dirs | Where-Object { Test-Path (Join-Path $_ "makensis.exe") } | Select-Object -First 1
          }

          $nsis = Find-Nsis

          if (-not $nsis) {
            for ($i = 1; $i -le 2 -and -not $nsis; $i++) {
              Write-Host "choco install nsis (attempt $i)"
              choco install nsis -y --no-progress
              Start-Sleep -Seconds 3
              $nsis = Find-Nsis
            }
          }

          if (-not $nsis) {
            Write-Host "chocolatey unavailable — downloading the portable NSIS build"
            $zip = Join-Path $env:RUNNER_TEMP "nsis-portable.zip"
            Invoke-WebRequest -Uri "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.10/nsis-3.10.zip" `
              -OutFile $zip -UseBasicParsing
            Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "nsis-portable") -Force
            $nsis = Find-Nsis
          }

          if (-not $nsis -or -not (Test-Path (Join-Path $nsis "makensis.exe"))) {
            throw "NSIS not found (chocolatey feed down and portable download failed)"
          }
          Write-Host "nsis: $nsis"
          $nsis | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & (Join-Path $nsis "makensis.exe") -VERSION
        shell: pwsh

      - name: Install npm dependencies (desktop)
        run: |
          cd apps/desktop
          npm ci
        shell: pwsh

      # Pure-Go services (preview origin, FS read limits, normalisation) are
      # covered here because this job already has the Wails/CGO toolchain the
      # package needs to compile on Windows.
      - name: Build frontend for the Go embed
        # main.go embeds `all:frontend/dist`, which is gitignored. Without this
        # the `go test ./...` step below fails at compile time on a fresh
        # checkout ("pattern all:frontend/dist: no matching files found").
        run: |
          cd apps/desktop
          npm run build
          Remove-Item -Recurse -Force ../desktop-wails/frontend/dist -ErrorAction SilentlyContinue
          Copy-Item -Recurse dist ../desktop-wails/frontend/dist
        shell: pwsh

      - name: Test Wails Go services
        run: |
          cd apps/desktop-wails
          go test ./...
        shell: pwsh

      - name: Build Wails desktop binary + NSIS installer
        # build.ps1 stages the agent runtime tree (resources/alice), bundles the
        # Python runtime (resources/python), zips resources.zip and, with -Nsis,
        # builds the user-scoped installer (no UAC on install/update).
        #
        # The version comes from the release tag and is stamped into wails.json
        # (NSIS + PE metadata, Add/Remove Programs) and linked into the binary.
        # Without it every build reported the repo's static 0.23.4 and Windows
        # kept offering the same "update".
        run: |
          $version = "${{ inputs.publish_tag }}"
          if (-not $version) { $version = "${{ github.ref_name }}" }
          $version = $version -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { $version = "" }
          Write-Host "Build version: '$version' (empty = derive from alice_cli/__init__.py)"
          cd apps/desktop-wails
          ./build.ps1 -Nsis -Version $version
        shell: pwsh

      - name: Verify binary exists
        run: |
          $bin = 'apps/desktop-wails/build/bin/alice-desktop.exe'
          if (-not (Test-Path $bin)) { throw "Wails binary not found at $bin" }
          Write-Host "✅ Wails binary: $((Resolve-Path $bin).Path) ($('{0:N0}' -f (Get-Item $bin).Length) bytes)"
        shell: pwsh

      - name: Verify NSIS installer exists
        run: |
          $installer = 'apps/desktop-wails/build/bin/alice-desktop-amd64-installer.exe'
          if (-not (Test-Path $installer)) { throw "NSIS installer not found at $installer" }
          Write-Host "✅ Installer: $((Resolve-Path $installer).Path) ($('{0:N1}' -f ((Get-Item $installer).Length / 1MB)) MB)"
        shell: pwsh

      - name: Verify runtime tree exists
        # python_manager.go resolves <exe>\resources\alice first: the installer
        # must carry the agent sources, otherwise a clean machine has nothing to
        # run.
        run: |
          $entry = 'apps/desktop-wails/build/bin/resources/alice/alice_cli/main.py'
          if (-not (Test-Path $entry)) { throw "runtime tree missing at $entry" }
          $skills = 'apps/desktop-wails/build/bin/resources/alice/skills'
          if (-not (Test-Path $skills)) { throw "runtime tree is missing skills/ at $skills" }
          Write-Host "✅ Runtime tree present (alice_cli/main.py + skills/)"
        shell: pwsh

      - name: Verify embedded Python bundle exists
        # bundle-python.ps1 (invoked by build.ps1) emits
        # build/bin/resources.zip (the distributable backend bundle) and the
        # unpacked resources/python beside the exe. Installer needs the zip.
        run: |
          $zip = 'apps/desktop-wails/build/bin/resources.zip'
          if (-not (Test-Path $zip)) { throw "Python bundle zip not found at $zip" }
          $py = 'apps/desktop-wails/build/bin/resources/python/python.exe'
          if (-not (Test-Path $py)) { throw "Unpacked bundle python.exe missing at $py" }
          Write-Host "✅ Python bundle: $((Resolve-Path $zip).Path) ($('{0:N1}' -f ((Get-Item $zip).Length / 1MB)) MB)"
        shell: pwsh

      - name: Write SHA-256 checksums
        # The Tauri bootstrap installer verifies these before installing the
        # binary + python bundle (scripts/install.ps1 →
        # Install-DesktopWailsPrebuilt).
        run: |
          $bin = 'apps/desktop-wails/build/bin/alice-desktop.exe'
          $zip = 'apps/desktop-wails/build/bin/resources.zip'
          $hash = (Get-FileHash $bin -Algorithm SHA256).Hash.ToLower()
          "$hash  alice-desktop.exe" | Out-File -FilePath "$bin.sha256" -Encoding ascii
          $zhash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$zhash  resources.zip" | Out-File -FilePath "$zip.sha256" -Encoding ascii

          # The desktop updater downloads this installer and verifies the
          # sidecar before running it silently (update_installer.go).
          $installer = 'apps/desktop-wails/build/bin/alice-desktop-amd64-installer.exe'
          $ihash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$ihash  alice-desktop-amd64-installer.exe" | Out-File -FilePath "$installer.sha256" -Encoding ascii
        shell: pwsh

      - name: Upload Wails binary artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: alice-desktop-wails-windows-${{ steps.meta.outputs.suffix }}
          path: |
            apps/desktop-wails/build/bin/alice-desktop.exe
            apps/desktop-wails/build/bin/alice-desktop.exe.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Upload embedded Python bundle artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: alice-desktop-python-bundle-windows-${{ steps.meta.outputs.suffix }}
          path: |
            apps/desktop-wails/build/bin/resources.zip
            apps/desktop-wails/build/bin/resources.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: alice-desktop-windows-installer-${{ steps.meta.outputs.suffix }}
          path: |
            apps/desktop-wails/build/bin/alice-desktop-amd64-installer.exe
            apps/desktop-wails/build/bin/alice-desktop-amd64-installer.exe.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Upload to release (tag push or manual publish)
        # Tag pushes publish automatically. A workflow_dispatch can publish to
        # an existing tag too (publish_tag), which is how a release can be
        # re-cut with the installer without bumping the version.
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_tag != ''
        uses: softprops/action-gh-release@v2  # v2.2.1
        with:
          tag_name: ${{ inputs.publish_tag != '' && inputs.publish_tag || github.ref_name }}
          make_latest: ${{ inputs.publish_tag != '' }}
          files: |
            apps/desktop-wails/build/bin/alice-desktop.exe
            apps/desktop-wails/build/bin/alice-desktop.exe.sha256
            apps/desktop-wails/build/bin/resources.zip
            apps/desktop-wails/build/bin/resources.zip.sha256
            apps/desktop-wails/build/bin/alice-desktop-amd64-installer.exe
            apps/desktop-wails/build/bin/alice-desktop-amd64-installer.exe.sha256
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Installer smoke test: the artifact users double-click must install and
  # launch the desktop with NO checkout and NO `alice` on PATH (the runtime tree
  # + Python runtime ship inside the installer).
  installer-smoke:
    name: Install + launch the NSIS installer
    needs: wails-build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Compute artifact suffix
        id: meta
        run: |
          $suffix = "${{ inputs.publish_tag }}"
          if (-not $suffix) { $suffix = "${{ github.ref_name }}" }
          $suffix = $suffix -replace '[^A-Za-z0-9._-]', '-'
          "suffix=$suffix" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        shell: pwsh

      - name: Download the installer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: alice-desktop-windows-installer-${{ steps.meta.outputs.suffix }}
          path: installer

      # The smoke machine must look like a normal desktop install: no repo, no
      # alice CLI. install.ps1's desktop stage is graphical-session gated, and
      # this job proves the *installer* path (which doesn't use that script).
      - name: Fail if alice is already on PATH
        run: |
          if (Get-Command alice -ErrorAction SilentlyContinue) { throw "runner unexpectedly has alice on PATH" }
        shell: pwsh

      - name: Install silently (user scope, no UAC)
        run: |
          $exe = Join-Path $PWD 'installer/alice-desktop-amd64-installer.exe'
          if (-not (Test-Path $exe)) { throw "installer missing at $exe" }
          $p = Start-Process -FilePath $exe -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs/Alice/alice-desktop.exe'
          if (-not (Test-Path $app)) { throw "installed app missing at $app" }
          $tree = Join-Path $env:LOCALAPPDATA 'Programs/Alice/resources/alice/alice_cli/main.py'
          if (-not (Test-Path $tree)) { throw "runtime tree missing after install: $tree" }
          $py = Join-Path $env:LOCALAPPDATA 'Programs/Alice/resources/python/python.exe'
          if (-not (Test-Path $py)) { throw "bundled python missing after install: $py" }
          "ALICE_APP=$app" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        shell: pwsh

      - name: Launch and wait for the backend to announce a port
        # A double-clicked installer build has no ALICE_HOME, so the shell uses
        # %USERPROFILE%\.alice (python_manager.NewPythonManager). Also accept
        # %LOCALAPPDATA%\alice in case the machine sets ALICE_HOME.
        run: |
          $app = $env:ALICE_APP
          $logs = @(
            (Join-Path $env:USERPROFILE '.alice/logs/agent.log'),
            (Join-Path $env:LOCALAPPDATA 'alice/logs/agent.log')
          )
          $debugLog = Join-Path $env:TEMP 'wails-debug.log'

          $proc = Start-Process -FilePath $app -PassThru
          $deadline = (Get-Date).AddMinutes(6)
          $ready = $false

          while ((Get-Date) -lt $deadline) {
            if ($proc.HasExited) { break }

            foreach ($log in $logs) {
              if (-not (Test-Path $log)) { continue }
              $tail = Get-Content $log -Tail 400 -ErrorAction SilentlyContinue | Out-String
              if ($tail -match 'ALICE_DASHBOARD_READY|Uvicorn running|Application startup complete|Alice Web UI') {
                $ready = $true
                break
              }
            }
            if ($ready) { break }

            if (Test-Path $debugLog) {
              $dbg = Get-Content $debugLog -Tail 200 -ErrorAction SilentlyContinue | Out-String
              if ($dbg -match 'announced port') { $ready = $true; break }
            }

            Start-Sleep -Seconds 3
          }

          if (-not $ready) {
            Write-Host "--- process exited: $($proc.HasExited) ---"
            foreach ($log in @($logs + $debugLog)) {
              Write-Host "--- $log ---"
              if (Test-Path $log) { Get-Content $log -Tail 120 }
            }
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            Get-Process python -ErrorAction SilentlyContinue |
              Where-Object { $_.Path -and $_.Path.StartsWith($env:USERPROFILE) } |
              Stop-Process -Force -ErrorAction SilentlyContinue
            throw "backend never announced a port (installer-only launch failed)"
          }

          Write-Host "✅ backend announced a port; app pid $($proc.Id)"

          # Kill the app AND the backend it spawned: the bundled python holds
          # resources\python\python.exe open, which would block the uninstall.
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Get-Process python -ErrorAction SilentlyContinue |
            Where-Object { $_.Path -and $_.Path.StartsWith($env:LOCALAPPDATA) } |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
        shell: pwsh

      - name: Uninstall silently
        run: |
          $uninst = Join-Path $env:LOCALAPPDATA 'Programs/Alice/uninstall.exe'
          if (Test-Path $uninst) {
            $p = Start-Process -FilePath $uninst -ArgumentList '/S' -PassThru -Wait
            if ($p.ExitCode -ne 0) { throw "uninstaller exited $($p.ExitCode)" }
          }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs/Alice'
          for ($i = 0; $i -lt 15 -and (Test-Path $dir); $i++) { Start-Sleep -Seconds 2 }

          # What matters is that nothing the installer put there survives: no
          # shell, no runtime tree, no embedded Python. An EMPTY leftover
          # directory is a Windows handle-timing artifact (the uninstaller was
          # still exiting when RMDir ran) and does not block a reinstall — it
          # used to fail this job intermittently with nothing to show for it.
          $left = @()
          if (Test-Path $dir) {
            $left = @(Get-ChildItem -Recurse -File $dir -ErrorAction SilentlyContinue)
          }

          if ($left.Count -gt 0) {
            $left | Select-Object -First 20 FullName | Format-Table -AutoSize
            throw "uninstall left $($left.Count) file(s) behind"
          }

          if (Test-Path $dir) {
            Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
            Write-Host '⚠ uninstall left an empty directory; removed it'
          }

          Write-Host '✅ uninstall removed the installed files'
        shell: pwsh

  # Optional: install + smoke-test on a clean Windows VM
