# .github/workflows/typecheck.yml
name: Typecheck

on:
  workflow_call:

jobs:
  typecheck:
    name: Check TypeScript
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          [ui-tui, web, apps/bootstrap-installer, apps/desktop, apps/shared]
      fail-fast: false # report all failures, not just the first one
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: typecheck only needs the TS sources + type defs, not
      # native builds. Skipping install scripts drops node-pty's node-gyp
      # header fetch — the transient flake that killed this job pre-`tsc` — and
      # is faster. retry covers the remaining registry blips.
      - uses: ./.github/actions/retry
        with:
          command: npm ci --ignore-scripts
      - run: npm run --prefix ${{ matrix.package }} typecheck

  # Production build of the desktop renderer. `typecheck` runs `tsc` only,
  # which does NOT exercise Vite/Rolldown module resolution — so an
  # unresolvable package export (e.g. a transitive @assistant-ui/tap that no
  # longer exports "./react-shim") slips past typecheck and only explodes when
  # users build apps/desktop from source on install/update. Run the real
  # `vite build` here so that class of break fails in CI instead.
  desktop-build:
    name: Build desktop app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # Keep install scripts here: the production build may need node-pty's
      # native binary. retry handles the transient install-time fetch flakes.
      - uses: ./.github/actions/retry
        with:
          command: npm ci
      # Preview-specific renderer tests (loopback origin wiring, sandbox,
      # teardown, lazy diff/markdown, read cache). Scoped to the preview suite
      # so unrelated pre-existing failures in the wider renderer suite cannot
      # block this gate.
      - name: Preview renderer tests
        run: >-
          npm run --prefix apps/desktop test:ui --
          src/app/chat/right-rail
          src/store/preview-lru.test.ts
          src/lib/shiki-cache.test.ts
          src/lib/preview-text-cache.test.ts
          src/lib/preview-telemetry.test.ts
          src/lib/desktop-capabilities.test.ts
      # Interaction invariants from apps/desktop/INTERACTION-PERFORMANCE-PLAN.md:
      # executable contracts (one git probe per click, no chat re-render on a
      # pane toggle, no terminal rAF polling, graph served by the loopback
      # origin, coalesced persistence, delete failure keeps the runtime alive).
      # Deterministic — no display, no Electron, no network.
      - name: Interaction invariants
        run: >-
          npm run --prefix apps/desktop test:ui --
          src/app/shell/main-pane-routes.test.tsx
          src/app/shell/graphify-canvas.test.tsx
          src/app/chat/chat-view-switch.test.tsx
          src/app/right-sidebar/terminal/persistent.test.tsx
          src/app/session/hooks/use-session-actions.test.tsx
          src/store/review.toggle.test.ts
          src/store/pane-visibility.test.ts
          src/store/panes.test.ts
          src/store/coding-status.test.ts
          src/lib/interaction-telemetry.test.ts
          src/app/settings/interaction-stats-panel.test.tsx
          src/lib/desktop-bridge.teardown.test.ts
          src/architecture-layers.test.ts
          src/app/composition-root.test.ts
          src/components/pane-shell/pane-shell.test.tsx
          src/lib/graphify-html-cache.test.ts
          src/lib/persisted-keys.test.ts
          src/store/wire.test.ts
          src/app/shell/render-scope.test.tsx
          src/app/shell-capabilities.test.ts
          src/app/chat/sidebar/session-row.test.ts
          src/app/chat/sidebar/sidebar-sections.test.tsx
          src/alice.test.ts
      # Pure-node check of the latency harness (stats + case table). The p95
      # measurement itself needs a display and runs manually.
      - name: Interaction harness self-test
        run: node apps/desktop/scripts/measure-interactions.mjs --self-test
      - run: npm run --prefix apps/desktop build

  # Bridge surface parity (Wails vs the deprecated Electron preload contract).
  # `scripts/endpoint-parity-check.sh` asserts that every top-level
  # `window.aliceDesktop.*` method Electron exposed still exists on the Wails
  # bridge, so removing/renaming a bridge method cannot silently shrink the
  # caller-visible surface. Fast, dependency-free (bash + grep only).
  desktop-parity:
    name: Check bridge parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: ./apps/desktop/scripts/endpoint-parity-check.sh "$GITHUB_WORKSPACE"
