name: langfuse
version: "1.0.0"
description: "Optional Langfuse observability for Alice — traces conversations, LLM calls, and tool usage. Opt-in via `alice plugins enable observability/langfuse` or `alice native → Langfuse Observability`."
author: Stuko
requires_env:
  - ALICE_LANGFUSE_PUBLIC_KEY
  - ALICE_LANGFUSE_SECRET_KEY
hooks:
  - pre_api_request
  - post_api_request
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
